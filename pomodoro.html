<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>番茄钟 — Ziqi Tab</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pomodoro-page page-fade-in">
  <button class="pomodoro-back" id="pomodoro-back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
      <path d="M19 12H5"/>
      <path d="M12 19l-7-7 7-7"/>
    </svg>
    返回主页
  </button>

  <div class="pomodoro-container">
    <div class="pomodoro-phase" id="pomodoro-phase">专注</div>

    <div class="pomodoro-ring-wrapper">
      <svg class="pomodoro-ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="pomodoro-ring-track" cx="60" cy="60" r="52"/>
        <circle class="pomodoro-ring-fill" cx="60" cy="60" r="52" id="pomodoro-ring-fill"
                stroke-dasharray="326.73" stroke-dashoffset="0"/>
      </svg>
      <time class="pomodoro-timer" id="pomodoro-timer">25:00</time>
    </div>

    <div class="pomodoro-sessions" id="pomodoro-sessions">
      <span class="pomodoro-dot" data-n="1"></span>
      <span class="pomodoro-dot" data-n="2"></span>
      <span class="pomodoro-dot" data-n="3"></span>
      <span class="pomodoro-dot" data-n="4"></span>
    </div>

    <div class="pomodoro-controls">
      <button class="pomodoro-btn btn-pomo-primary" id="pomodoro-start">开始</button>
      <button class="pomodoro-btn btn-pomo-secondary" id="pomodoro-pause" hidden>暂停</button>
      <button class="pomodoro-btn btn-pomo-secondary" id="pomodoro-resume" hidden>继续</button>
      <button class="pomodoro-btn btn-pomo-ghost" id="pomodoro-skip" hidden>跳过</button>
      <button class="pomodoro-btn btn-pomo-danger" id="pomodoro-stop" hidden>结束</button>
    </div>

    <details class="pomodoro-settings">
      <summary class="pomodoro-settings-summary">时长设置</summary>
      <div class="pomodoro-settings-body">
        <label class="pomodoro-setting-row">
          <span>专注</span>
          <input type="number" id="pomo-work" class="pomodoro-time-input" min="1" max="90" value="25"> 分钟
        </label>
        <label class="pomodoro-setting-row">
          <span>短休息</span>
          <input type="number" id="pomo-short-break" class="pomodoro-time-input" min="1" max="30" value="5"> 分钟
        </label>
        <label class="pomodoro-setting-row">
          <span>长休息</span>
          <input type="number" id="pomo-long-break" class="pomodoro-time-input" min="1" max="60" value="15"> 分钟
        </label>
        <label class="pomodoro-setting-row">
          <span>间隔</span>
          <input type="number" id="pomo-long-interval" class="pomodoro-time-input" min="2" max="10" value="4"> 个番茄
        </label>
      </div>
    </details>
  </div>

  <script type="module" src="js/pomodoro-page.js"></script>
</body>
</html>
