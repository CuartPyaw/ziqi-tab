<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置 - Ziqi Tab</title>
  <link rel="icon" type="image/png" sizes="48x48" href="icons/icon-48.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body class="settings-page">
  <main class="settings-page-shell">
    <header class="settings-page-header">
      <h1>设置</h1>
    </header>

    <div class="settings-layout">
      <nav class="settings-nav" id="settings-nav" aria-label="设置分类">
        <button type="button" class="settings-nav-item active" data-tab="dashboard">仪表盘</button>
        <button type="button" class="settings-nav-item" data-tab="search">搜索栏</button>
        <button type="button" class="settings-nav-item" data-tab="engines">搜索引擎</button>
        <button type="button" class="settings-nav-item" data-tab="ai">AI</button>
      </nav>

      <div class="settings-panels" id="settings-panels">
        <section class="settings-panel active" data-panel="dashboard">
          <h2 class="settings-panel-title">仪表盘</h2>
          <div class="settings-item">
            <label class="settings-label" for="recent-enabled">最近浏览</label>
            <label class="settings-switch"><input type="checkbox" id="recent-enabled">显示最近浏览</label>
            <fieldset class="settings-choice" id="recent-limit-group">
              <legend class="settings-label">显示数量</legend>
              <label><input type="radio" name="recent-limit" value="4"> 4</label>
              <label><input type="radio" name="recent-limit" value="8"> 8</label>
              <label><input type="radio" name="recent-limit" value="12"> 12</label>
            </fieldset>
          </div>
          <div class="settings-item">
            <label class="settings-label" for="todos-enabled">待办事项</label>
            <label class="settings-switch"><input type="checkbox" id="todos-enabled">显示待办事项</label>
          </div>
        </section>

        <section class="settings-panel" data-panel="search">
          <h2 class="settings-panel-title">搜索栏</h2>
          <div class="settings-item">
            <label class="settings-label" for="search-width">搜索栏长度</label>
            <div class="settings-row">
              <input type="range" id="search-width" class="settings-slider" min="360" max="720" value="520" step="10">
              <span class="settings-value" id="search-width-value">520px</span>
            </div>
          </div>
        </section>

        <section class="settings-panel" data-panel="engines">
          <div class="settings-list-view" id="engine-list-view">
            <h2 class="settings-panel-title">搜索引擎</h2>
            <ul class="engine-list" id="engine-list"></ul>
            <button type="button" class="engine-add-btn" id="engine-add-btn">添加搜索引擎</button>
          </div>

          <form class="settings-editor" id="engine-form" hidden>
            <div class="settings-editor-heading">
              <button type="button" class="settings-back-btn" id="engine-form-cancel" aria-label="返回搜索引擎列表" title="返回列表">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
              </button>
              <h2 class="settings-panel-title" id="engine-form-title">添加搜索引擎</h2>
            </div>
            <label class="settings-label" for="engine-name">引擎名称</label>
            <input type="text" id="engine-name" class="settings-input" placeholder="例如：Kagi" required>
            <label class="settings-label" for="engine-url">搜索 URL</label>
            <input type="url" id="engine-url" class="settings-input" placeholder="https://kagi.com/search?q=" required>
            <p class="settings-hint">查询词会追加在 URL 末尾</p>
            <div class="settings-editor-actions">
              <button type="button" class="settings-delete-btn" id="engine-delete" hidden>删除</button>
              <button type="submit" class="settings-save-btn">保存</button>
            </div>
          </form>
        </section>

        <section class="settings-panel" data-panel="ai">
          <div class="settings-list-view" id="ai-site-list-view">
            <h2 class="settings-panel-title">AI</h2>
            <ul class="ai-site-list" id="ai-site-list"></ul>
            <button type="button" class="engine-add-btn" id="ai-site-add-btn">添加 AI 网站</button>
          </div>

          <form class="settings-editor" id="ai-site-form" hidden>
            <div class="settings-editor-heading">
              <button type="button" class="settings-back-btn" id="ai-site-form-cancel" aria-label="返回 AI 网站列表" title="返回列表">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
              </button>
              <h2 class="settings-panel-title" id="ai-site-form-title">添加 AI 网站</h2>
            </div>
            <label class="settings-label" for="ai-site-name">名称</label>
            <input type="text" id="ai-site-name" class="settings-input" placeholder="例如：ChatGPT" required>
            <label class="settings-label" for="ai-site-shortcut">快捷词</label>
            <input type="text" id="ai-site-shortcut" class="settings-input" placeholder="例如：gpt" required>
            <label class="settings-label" for="ai-site-url">URL 模板</label>
            <input type="url" id="ai-site-url" class="settings-input" placeholder="https://example.com/?q={query}" required>
            <p class="settings-hint">使用 {query} 将 Prompt 填入 URL；省略时只打开网站。</p>
            <div class="settings-editor-actions">
              <button type="button" class="settings-delete-btn" id="ai-site-delete" hidden>删除</button>
              <button type="submit" class="settings-save-btn">保存</button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </main>

  <script type="module" src="js/settings-page.js"></script>
</body>
</html>
