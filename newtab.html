<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ziqi Tab</title>
  <link rel="icon" type="image/png" sizes="48x48" href="icons/icon-48.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://cdn.simpleicons.org">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/clock.css">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="css/links.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/bookmarks.css">
</head>
<body>
  <div id="nav-progress" class="nav-progress"></div>
  <div class="container">
    <div class="page page--main page--active">
    <header class="hero">
      <div class="hero-stage">
        <div id="clock-display">
          <div class="day-row">
            <span id="date">----年--月--日</span>
          </div>
          <div class="time" id="time"><span id="time-hm">--:--</span><span id="time-sec" class="time-sec">:--</span></div>
          <p class="moment-line" id="greeting">--</p>
        </div>
      </div>

      <div class="search-wrapper">
        <div class="search-bar" id="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.3-4.3"/>
          </svg>
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="搜索…"
            autofocus
            autocomplete="off"
          >
          <div class="engine-dropdown" id="engine-dropdown">
            <button class="engine-icon-btn" id="engine-icon-btn" type="button" title="点击切换搜索引擎 | Tab 循环">
              <img class="engine-icon" id="engine-icon" src="" alt="" />
              <span class="engine-letter" id="engine-letter" hidden></span>
            </button>
            <button class="engine-chevron-btn" id="engine-chevron-btn" type="button" title="查看所有搜索引擎" aria-haspopup="true">
              <svg class="engine-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>
            <div class="engine-menu" id="engine-menu" hidden></div>
          </div>
          <div class="engine-backdrop" id="engine-backdrop" hidden></div>
        </div>
      </div>
    </header>

    <div class="content-switcher" id="content-switcher">
      <div class="content-switcher-pill" id="content-switcher-pill"></div>
      <button class="content-switcher-btn is-active" data-view="links">快捷网址</button>
      <button class="content-switcher-btn" data-view="bookmarks">书签栏</button>
    </div>

    <div class="content-stage" id="content-stage">
    <section class="quick-links" id="quick-links">
      <ul class="links-grid" id="links-grid"></ul>
    </section>

    <section class="bookmarks-section" id="bookmarks-section" hidden>
      <div class="bookmark-folder-header" id="bookmark-folder-header" hidden>
        <button class="bookmark-back-btn" id="bookmark-back-btn" type="button" title="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <span class="bookmark-folder-title" id="bookmark-folder-title"></span>
      </div>
      <ul class="bookmarks-grid" id="bookmarks-grid"></ul>
      <div class="bookmark-empty-state" id="bookmark-empty-state" hidden>
        <p class="bookmark-empty-text" id="bookmark-empty-text"></p>
      </div>
    </section>
    </div>
    </div>

  <footer class="settings-bar">
      <a href="chrome://extensions" class="settings-btn" title="扩展程序" aria-label="扩展程序">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 12.5V8a2 2 0 0 0-2-2h-4.5a2.5 2.5 0 0 1-5 0H4a2 2 0 0 0-2 2v4.5a2.5 2.5 0 0 1 5 0 2.5 2.5 0 0 1-5 0V20a2 2 0 0 0 2 2h4.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5H20a2 2 0 0 0 2-2v-4.5a2.5 2.5 0 0 1-5 0 2.5 2.5 0 0 1 5 0Z"/>
        </svg>
      </a>
      <a href="chrome://history" class="settings-btn" title="历史记录" aria-label="历史记录">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M12 7v5l4 2"/>
        </svg>
      </a>
      <button id="settings-toggle" class="settings-btn" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"/>
          <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
        </svg>
      </button>
      <button id="theme-toggle" class="settings-btn" title="切换深色/浅色模式">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
  </footer>

  <dialog id="link-dialog" class="link-dialog">
    <form method="dialog" id="link-form">
      <h3 class="dialog-title">编辑快捷链接</h3>
      <label class="dialog-label">
        名称
        <input type="text" id="link-title" class="dialog-input" placeholder="例如：GitHub" required>
      </label>
      <label class="dialog-label">
        网址
        <input type="url" id="link-url" class="dialog-input" placeholder="https://" required>
      </label>
      <label class="dialog-label">
        图标 URL（可选）
        <input type="url" id="link-icon" class="dialog-input" placeholder="自定义 SVG 图标 URL，留空则自动获取">
      </label>
      <div class="dialog-actions">
        <button type="button" id="link-delete" class="dialog-btn btn-delete" hidden>删除</button>
        <div class="dialog-actions-right">
          <button type="button" value="cancel" class="dialog-btn btn-cancel">取消</button>
          <button type="submit" class="dialog-btn btn-save">保存</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="settings-dialog" class="settings-dialog">
    <form method="dialog" class="settings-form">
      <div class="settings-layout">
        <nav class="settings-nav" id="settings-nav">
          <button type="button" class="settings-nav-item active" data-tab="search">
搜索栏
          </button>
          <button type="button" class="settings-nav-item" data-tab="engines">
搜索引擎
          </button>
          <button type="button" class="settings-nav-item" data-tab="display">显示</button>
        </nav>
        <div class="settings-panels" id="settings-panels">
          <div class="settings-panel active" data-panel="search">
            <h3 class="settings-panel-title">搜索栏</h3>
            <div class="settings-item">
              <label class="settings-label">搜索栏长度</label>
              <div class="settings-row">
                <input type="range" id="search-width" class="settings-slider" min="360" max="720" value="520" step="10">
                <span class="settings-value" id="search-width-value">520px</span>
              </div>
            </div>
          </div>
          <div class="settings-panel" data-panel="engines">
            <h3 class="settings-panel-title">搜索引擎</h3>
            <ul class="engine-list" id="engine-list"></ul>
            <button type="button" class="engine-add-btn" id="engine-add-btn">+ 添加搜索引擎</button>
          </div>
          <div class="settings-panel" data-panel="display">
            <h3 class="settings-panel-title">显示</h3>
            <div class="settings-item">
              <label class="settings-label">默认内容</label>
              <div class="settings-radio-group">
                <label class="settings-radio">
                  <input type="radio" name="default-view" value="links" checked>
                  <span>快捷网址</span>
                </label>
                <label class="settings-radio">
                  <input type="radio" name="default-view" value="bookmarks">
                  <span>书签栏</span>
                </label>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="settings-footer">
        <div class="dialog-actions-right">
          <button type="button" value="cancel" class="dialog-btn btn-cancel">关闭</button>
          <button type="button" id="settings-save" class="dialog-btn btn-save">保存</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="engine-form-dialog" class="engine-form-dialog" aria-labelledby="engine-form-title">
    <form method="dialog" id="engine-form">
      <h3 class="dialog-title" id="engine-form-title">添加搜索引擎</h3>
      <label class="dialog-label">
        引擎名称
        <input type="text" id="engine-name" class="dialog-input" placeholder="例如：Kagi" required>
      </label>
      <label class="dialog-label">
        搜索 URL
        <input type="url" id="engine-url" class="dialog-input" placeholder="https://kagi.com/search?q=" required>
      </label>
      <p class="dialog-hint">查询词会追加在 URL 末尾</p>
      <div class="dialog-actions">
        <div class="dialog-actions-right">
          <button type="button" value="cancel" class="dialog-btn btn-cancel">取消</button>
          <button type="submit" class="dialog-btn btn-save">保存</button>
        </div>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/bookmarks.js"></script>
</body>
</html>
